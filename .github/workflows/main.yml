
name: Build Touch Assist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchAssist-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare phone-friendly APK filename
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/*.apk TouchAssist.apk

      - name: Publish direct APK download for phones
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: touchassist-latest
          target_commitish: main
          name: Touch Assist APK (Latest)
          body: "Direct APK download for Android phones. Download TouchAssist.apk below."
          files: TouchAssist.apk
          fail_on_unmatched_files: true
